<script>
(function(){
  var st=document.getElementById('stage'),tag=document.getElementById('tag'),c1=document.getElementById('c1'),c2=document.getElementById('c2');
  function layout(){
    var w=innerWidth,h=innerHeight,portrait=w/h<1.15,s,ox,oy;
    if(!portrait){
      s=Math.min(w/1920,h/1080);ox=(w-1920*s)/2;oy=(h-1080*s)/2;
      place(c1,ox,oy,s,61,60,190);place(c2,ox,oy,s,1510,60,350);
      tag.style.visibility='';
    }else{
      s=w/1340;ox=w/2-960*s;oy=h/2-540*s;
      var m=Math.max(16,w*.05);
      box(c1,m,m,Math.min(w*.36,190));
      box(c2,null,m,Math.min(w*.46,350),m);
      tag.style.visibility='hidden';
    }
    st.style.transform='translate('+ox+'px,'+oy+'px) scale('+s+')';
    var hs=document.getElementById('hero');if(hs)hs.style.height=h+'px';
    document.documentElement.classList.add('ready');
  }
  function place(el,ox,oy,s,x,y,wd){el.style.left=ox+x*s+'px';el.style.top=oy+y*s+'px';el.style.right='auto';el.style.width=wd*s+'px'}
  function box(el,l,t,wd,r){el.style.left=l==null?'auto':l+'px';el.style.right=r==null?'auto':r+'px';el.style.top=t+'px';el.style.width=wd+'px'}
  addEventListener('resize',layout);layout();
})();
</script>

<script>
(function(){
  var root=document.documentElement;
  if(!root.classList.contains('intro-pending'))return; /* 모션 감소: 완성된 정적 히어로, 플로팅도 없음 */

  /* ================= 타이밍 설정 (초) =================
     at = 시작 시점(페이지 진입 기준), dur = 재생 시간, 끝 = at + dur */
  var C={
    planet:{at:0.00,dur:0.50,ease:'power2.out',scaleFrom:0.96},
    /* 타이틀: AE 영상 프레임을 dur 안에 맞춰 재생. handoff = 끝나기 handoffLead초 전부터

  var q=function(s){return document.querySelector(s)};

    tl.fromTo(TAG,{opacity:0,y:C.intro.y},{opacity:1,y:0,duration:C.intro.dur,ease:C.intro.ease},C.intro.at);

  }catch(e){bail()}
})();

  function setUI(a){ if(uiSet||!a.ui)return; $('pcimg').src=a.ui.close.src;$('ppimg').src=a.ui.prev.src;$('pnimg').src=a.ui.next.src;uiSet=true }
  function swap(i){
    var it=list[i],secs=it.sections||[it];pimg.innerHTML=''; /* sections: 긴 상세 페이지를 여러 장으로 나눠 올린 경우 세로로 이어 붙임 */
    secs.forEach(function(s,k){var m=new Image();if(s.w&&s.h){m.width=s.w;m.height=s.h}m.src=s.src;m.draggable=false;
      m.alt=secs.length>1?(it.alt||'')+' ('+(k+1)+'/'+secs.length+')':(it.alt||'');pimg.appendChild(m)});
    pscroll.scrollTop=0;pstat.textContent='상세 디자인 '+(i+1)+' / '+list.length;
  }
  function show(i,first){
    idx=((i%list.length)+list.length)%list.length;var my=++tk;
    if(first||RM||!window.gsap){swap(idx);if(window.gsap)gsap.set(pimg,{opacity:1});return}
    gsap.killTweensOf(pimg);
    gsap.to(pimg,{opacity:0,duration:0.125,ease:'power1.out',onComplete:function(){
      if(my!==tk)return;swap(idx);
      var d=Promise.all([].map.call(pimg.querySelectorAll('img'),function(m){return m.decode?m.decode().catch(function(){}):0}));
      d.then(function(){if(my!==tk)return;gsap.to(pimg,{opacity:1,duration:0.125,ease:'power1.in'})});
    }});
  }
  function open(d){
    var a=A[d.archive],c=a&&a.cards.filter(function(x){return x.id===d.card})[0];
    if(!c||!c.detailImages||!c.detailImages.length||isOpen)return; /* 상세 이미지가 없는 카드는 열지 않음 */
    setUI(a);list=c.detailImages;isOpen=true;savedY=scrollY;
    opener=document.querySelector('.fd[data-card="'+d.card+'"]');
    var start=0;/* 카드 캐러셀 ↔ 상세 이미지 매핑(detailMap)이 명시된 경우에만 연동 */
    if(c.detailMap&&d.carouselIndex!=null&&c.detailMap[d.carouselIndex]!=null&&c.detailMap[d.carouselIndex]<list.length)start=c.detailMap[d.carouselIndex];
    dlg.setAttribute('aria-label',c.title+' FULL DESIGN 상세보기');
    var multi=list.length>1;bp.style.display=bn.style.display=multi?'':'none';
    var sbw=innerWidth-root.clientWidth;root.classList.add('pop-open');if(sbw>0)root.style.paddingRight=sbw+'px';
    if(arch){arch.inert=true;arch.setAttribute('aria-hidden','true')}
    pov.classList.add('on');pov.setAttribute('aria-hidden','false');
    show(start,true);
    if(!RM&&window.gsap){
      gsap.killTweensOf([pov,dlg]);gsap.set(pov,{opacity:0});gsap.set(dlg,{opacity:0,scale:0.96});
      gsap.to(pov,{opacity:1,duration:0.3,ease:'power2.out'});
      gsap.to(dlg,{opacity:1,scale:1,duration:0.3,ease:'power2.out',onComplete:function(){gsap.set([pov,dlg],{clearProps:'opacity,transform'})}});
    }
    pscroll.focus({preventScroll:true});
  }
  function close(now){
    if(!isOpen)return;isOpen=false;tk++;
    function done(){
      if(window.gsap){gsap.killTweensOf([pov,dlg,pimg]);gsap.set([pov,dlg],{clearProps:'opacity,transform'});gsap.set(pimg,{opacity:1})}
      pov.classList.remove('on');pov.setAttribute('aria-hidden','true');root.classList.remove('pop-open');root.style.paddingRight='';
      if(arch){arch.inert=false;arch.removeAttribute('aria-hidden')}
      scrollTo(0,savedY);if(opener&&opener.focus)opener.focus({preventScroll:true});
    }
    if(now||RM||!window.gsap){done();return}
    gsap.killTweensOf([pov,dlg]);gsap.to(pov,{opacity:0,duration:0.2,ease:'power2.in',onComplete:done});
  }
  document.addEventListener('archive:fulldesign',function(e){open(e.detail||{})});
  bc.addEventListener('click',function(){close()});
  bp.addEventListener('click',function(){show(idx-1)});
  bn.addEventListener('click',function(){show(idx+1)});
  pov.addEventListener('pointerdown',function(e){downOv=e.target===pov});
  pov.addEventListener('click',function(e){if(e.target===pov&&downOv)close();downOv=false});
  document.addEventListener('keydown',function(e){
    if(!isOpen)return;
    if(e.key==='Escape'){e.preventDefault();close();return}
    if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&list.length>1){e.preventDefault();show(idx+(e.key==='ArrowLeft'?-1:1));return}
    if(e.key==='Tab'){ /* 포커스를 팝업 안에 가둠 */
      var f=[bc,bp,bn,pscroll].filter(function(x){return x.offsetParent!==null||x===pscroll});
      var i=f.indexOf(document.activeElement);
      if(i<0){e.preventDefault();f[0].focus();return}
      if(e.shiftKey&&i===0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}
    }
  });
  addEventListener('hashchange',function(){close(true)});
})();
</script>
</body>
</html>
